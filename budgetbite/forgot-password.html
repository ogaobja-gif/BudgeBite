<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password · BudgetBite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
<main class="shell">
  <aside class="hero">
    <a class="brand" href="login.html"><span class="logo">🍲</span>Budget<b>Bite</b></a>
    <div class="hero-copy">
      <h2>Eat well.<br>Spend less.</h2>
      <p>Discover affordable, home-cooked meals from local carinderias near you.</p>
      <ul><li>🍛 Budget-friendly meals</li><li>🥗 Fresh daily menus</li><li>🏪 Support local sellers</li></ul>
    </div>
    <div class="blobs" aria-hidden="true"></div>
  </aside>
  <section class="panel"><div class="card">
    <h1>Forgot password?</h1>
    <p class="sub">Enter your email and we'll send you a link to reset your password.</p>
    <div id="alert" class="alert" role="alert" hidden></div>
    <form id="forgotForm" novalidate>
      <div class="field"><label for="email">Email address</label><input type="email" id="email" name="email" autocomplete="email" ><small class="error"></small></div>
      <button class="btn" type="submit"><span>Send Reset Link</span></button>
    </form>
    <p class="switch"><a href="login.html">&larr; Back to login</a></p>
  </div></section>
</main>
<script src="assets/js/auth.js" defer></script>
</body>
</html>
